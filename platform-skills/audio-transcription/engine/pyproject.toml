[project]
name = "trelio-audio-transcription-engine"
version = "1.0.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.8.0", "torchaudio==2.8.0", "numpy==2.2.6",
  "hydra-core==1.3.2", "omegaconf==2.3.0", "sentencepiece==0.2.1",
  "soundfile==0.13.1", "tqdm==4.67.1", "imageio-ffmpeg==0.6.0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools==80.9.0", "wheel==0.45.1"]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
